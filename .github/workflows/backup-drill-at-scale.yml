name: backup-drill-at-scale

# Manual only: the TEST-ONLY backup and restore drill (ADR-0045) over the load-test book
# (default 50,000 members, 20,000 loans) on PostgreSQL 17, to measure backup and restore times.
# No external systems, no secrets.
on:
  workflow_dispatch:
    inputs:
      members:
        description: Savings members to seed
        default: '50000'
      loans:
        description: Loans to seed
        default: '20000'

permissions:
  contents: read

jobs:
  drill:
    name: Backup and restore drill at scale (TEST-ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mfi_owner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mfi_owner" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: mfi_owner
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL 17 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Install btree_gist in template
        run: psql -d template1 -c "CREATE EXTENSION IF NOT EXISTS btree_gist"
      - name: Drill
        env:
          MEMBERS: ${{ inputs.members }}
          LOANS: ${{ inputs.loans }}
        run: |
          [[ "$MEMBERS" =~ ^[0-9]+$ && "$LOANS" =~ ^[0-9]+$ ]] || { echo "members and loans must be numbers"; exit 1; }
          start=$(date +%s)
          bash infrastructure/scripts/bash/tests/backup-restore-drill.sh "$MEMBERS" "$LOANS" 2>&1 | grep -v "^   V[0-9]" | tee drill.txt
          echo "drill wall time: $(( $(date +%s) - start )) s"
          grep -q "DRILL RESULT: all checks passed" drill.txt
