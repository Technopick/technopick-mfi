name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and tests
        shell: bash
        # Container-based integration tests need Linux containers: they run on ubuntu only.
        run: mvn -B -ntp verify ${{ matrix.os == 'windows-latest' && '-Dsurefire.excludedGroups=integration,sandbox,performance' || '' }}
      - name: Print generated OpenAPI document (contract drift)
        if: failure() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          f=services/core-banking/target/openapi/core-banking-v1.json
          if [ -f "$f" ]; then echo "----- BEGIN OPENAPI -----"; base64 -w0 "$f"; echo; echo "----- END OPENAPI -----"; fi
      - name: Upload generated OpenAPI document
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: openapi
          path: services/core-banking/target/openapi/
          if-no-files-found: ignore

  staff-web:
    name: staff web app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/staff-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/staff-web/package-lock.json
      - run: npm ci
      - name: API types match the OpenAPI contract
        run: npm run api:check
      - name: Runtime dependencies have no known high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end (TEST-ONLY stack, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/staff-web/package-lock.json
      - name: Build services and the TEST-ONLY simulator
        run: |
          mvn -B -ntp -DskipTests package -pl services/core-banking,services/integration,simulators/daraja-simulator -am
          mvn -B -ntp -pl simulators/daraja-simulator dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/lib
      - name: Build the staff web app
        working-directory: apps/staff-web
        run: npm ci && npm run build
      - name: Start the stack
        run: |
          docker compose -f infrastructure/e2e/docker-compose.yml up -d --build --wait --wait-timeout 420
          docker compose -f infrastructure/e2e/docker-compose.yml --profile seed run --rm seed
      - name: Browser journey (Playwright, Chromium)
        working-directory: apps/staff-web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Browser test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: apps/staff-web/test-results
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: |
          docker compose -f infrastructure/e2e/docker-compose.yml logs --no-color --tail=300
          docker compose -f infrastructure/e2e/docker-compose.yml logs --no-color core integration | grep -E "WARN|ERROR|Exception" | tail -80 || true
      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/e2e/docker-compose.yml down -v

  ledger-db-tests:
    name: ledger database invariants (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mfi_owner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mfi_owner" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: mfi_owner
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v5
      - name: Install btree_gist in template
        run: psql -d template1 -c "CREATE EXTENSION IF NOT EXISTS btree_gist"
      - name: Run ledger invariant tests
        run: bash services/core-banking/src/test/sql/run-ledger-db-tests.sh

  windows-packaging:
    name: Windows service packaging smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate PowerShell scripts parse
        shell: pwsh
        run: |
          Get-ChildItem infrastructure/scripts/powershell -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; throw "Parse errors in $($_.Name)" }
            Write-Host "OK $($_.Name)"
          }
