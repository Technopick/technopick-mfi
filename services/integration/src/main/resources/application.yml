spring:
  application:
    name: integration
  # The relay connects as mfi_relay: reads every tenant's outbox, may only mark publication.
  datasource:
    url: ${MFI_DB_URL:jdbc:postgresql://localhost:5432/mfi}
    username: ${MFI_DB_RELAY_USER:mfi_relay}
    password: ${MFI_DB_RELAY_PASSWORD:}
    hikari:
      maximum-pool-size: 4
  rabbitmq:
    host: ${MFI_RABBITMQ_HOST:localhost}
    port: ${MFI_RABBITMQ_PORT:5672}
    username: ${MFI_RABBITMQ_USER:mfi}
    password: ${MFI_RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated

camel:
  main:
    name: mfi-integration

server:
  port: ${MFI_INTEGRATION_PORT:8081}
  shutdown: graceful

mfi:
  core:
    base-url: ${MFI_CORE_BASE_URL:http://localhost:8080}
    # OAuth2 client-credentials client with role INTEGRATION in the platform IdP.
    token-uri: ${MFI_CORE_TOKEN_URI:}
    client-id: ${MFI_CORE_CLIENT_ID:mfi-integration}
    client-secret: ${MFI_CORE_CLIENT_SECRET:}
  daraja:
    # Per tenant paybill: an unguessable path token (from the secret store) plus the short code.
    # Daraja callback URLs are https://<host>/daraja/c2b/<token>/{validation|confirmation}.
    paybills: []
    # Safaricom callback source ranges, from Safaricom's current documentation (never hard-coded).
    allowed-cidrs: []
    # Business decision 2026-11-18 (ADR-0009): if core cannot be asked, let the payment go through;
    # confirmation then credits the account or, if the reference is unknown, suspense.
    validation-on-error: ${MFI_DARAJA_VALIDATION_ON_ERROR:ACCEPT}
    processor-enabled: ${MFI_DARAJA_PROCESSOR_ENABLED:true}
    process-interval-ms: 2000
    max-attempts: 10
    retry-backoff: PT30S
  outbox:
    enabled: ${MFI_OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: ${MFI_OUTBOX_POLL_MS:1000}
    batch-size: ${MFI_OUTBOX_BATCH:100}
    exchange: mfi.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
