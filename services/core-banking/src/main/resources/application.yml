# Core banking configuration. Secrets come from the environment / secret store, never this file.
spring:
  application:
    name: core-banking
  threads:
    virtual:
      enabled: true
  # Application connects as the least-privilege role mfi_app (NOSUPERUSER, NOBYPASSRLS).
  datasource:
    url: ${MFI_DB_URL:jdbc:postgresql://localhost:5432/mfi}
    username: ${MFI_DB_APP_USER:mfi_app}
    password: ${MFI_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${MFI_DB_POOL_SIZE:20}
      auto-commit: false
  # Migrations run as the schema owner, never as the application role.
  flyway:
    url: ${MFI_DB_URL:jdbc:postgresql://localhost:5432/mfi}
    user: ${MFI_DB_OWNER_USER:mfi_owner}
    password: ${MFI_DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
    validate-on-migrate: true
  # OIDC issuer: set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI in each environment.
  # The service refuses to start without it (no JwtDecoder), so it can never run unauthenticated.
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

mfi:
  jobs:
    # Background jobs (hold expiry). Disabled in tests that drive jobs directly.
    enabled: ${MFI_JOBS_ENABLED:true}
    hold-expiry-interval: ${MFI_HOLD_EXPIRY_INTERVAL:PT1M}
  security:
    # JWT claim carrying the caller's tenant for staff and customer tokens.
    tenant-claim: tenant_id
    member-claim: customer_number
    roles-claim: roles
  # Member self-service (ADR-0033) and USSD (ADR-0034).
  member:
    payment-prompts-per-window: 3
    payment-prompt-window-minutes: 10
    requests-per-minute: 60
  ussd:
    # Wrong PINs (or ID numbers during setup) before the PIN locks; a locked PIN needs an approved reset.
    max-pin-attempts: 3
    # How long an approved setup lets the member choose a PIN.
    pin-setup-hours: 24
    # Aggregators end sessions after about three minutes; older session ids are refused.
    session-max-seconds: 180
  # SMS to members (ADR-0035). Sending is switched on per tenant in the staff app (off by default).
  sms:
    # Sends per message before it is marked FAILED (back-off 1, 5, 15, 60 minutes between them).
    max-attempts: 5
    # A claim the sender never reported is queued again after this (the member may get it twice).
    stale-claim: PT5M

# OpenAPI document: off unless explicitly enabled; when on, only PLATFORM_ADMIN may read it.
# The reviewed contract lives in shared/contracts/openapi/core-banking-v1.json.
springdoc:
  api-docs:
    enabled: ${MFI_API_DOCS_ENABLED:false}
  writer-with-order-by-keys: true
