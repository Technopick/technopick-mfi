# LOCAL DEVELOPMENT ONLY. Credentials below are development placeholders and are rejected
# by the production profile. Never point this file at real customer data or live networks.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#
# Image tags are pinned; review and bump with dependency updates (ADR-0002).
# NOTE: these tags were written without registry access (Phase 1, increment 1) and have
# not been pulled yet - confirm each one exists on the first `docker compose pull`.
# Core, switch, integration and simulator services are added as their deployables land.
name: technopick-mfi-dev

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: mfi_owner
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_DB: mfi
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfi_owner -d mfi"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: mfi
      RABBITMQ_DEFAULT_PASS: dev-only-change-me
    ports: ["5672:5672", "15672:15672"]

  redis:
    image: redis:8.2
    ports: ["6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-change-me
    ports: ["8180:8080"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: mfi
      MINIO_ROOT_PASSWORD: dev-only-change-me
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
